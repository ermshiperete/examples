<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Test page in Quirks mode</title>
    <link rel="stylesheet" href="style.css">
    <!-- <script src='https://s.keyman.com/kmw/engine/18.0.166/keymanweb.js'></script>
    <script src='https://s.keyman.com/kmw/engine/18.0.166/kmwuitoggle.js'></script> -->
    <script src='https://s.keyman.com/kmw/engine/17.0.331/keymanweb.js'></script>
    <script src='https://s.keyman.com/kmw/engine/17.0.331/kmwuitoggle.js'></script>
    <script>
      function setHideVirtualKeyboardOnFocus(id) {
        const element = document.getElementById(id);
        element.addEventListener('focus', function() {
          navigator.virtualKeyboard.hide();
        });
      }
      (function () {
        keyman.init({
          attachType: 'manual'
        }).then(function() {
          keyman.addKeyboards('lo');

          /* Disable KeymanWeb interaction on the 'Email to' TEXT control */
          keyman.disableControl(document.f.address);
          /* Set the default keyboard for the 'Subject' TEXT control to 'off' (i.e. default browser keyboard) */
          /* As KeymanWeb relies on the on-screen keyboard to change languages for touch-based devices, this will
          * not work for them and will default to the first language added to KeymanWeb after initialization. */
          keyman.setKeyboardForControl(document.f.subject, '', '');
          /* Set the default keyboard for the 'Message body' TEXTAREA to the LaoKeys keyboard */
          keyman.setKeyboardForControl(document.f.text, 'Keyboard_laokeys', 'lo');

          keyman.disableControl(document.getElementById('numeric-input-web'));
          keyman.setKeyboardForControl(document.getElementById('non-input-web'), 'Keyboard_laokeys', 'lo');
          keyman.setKeyboardForControl(document.getElementById('email-input-web'), 'Keyboard_laokeys', 'lo');
          keyman.setKeyboardForControl(document.getElementById('regular-input-web'), 'Keyboard_laokeys', 'lo');
          keyman.setKeyboardForControl(document.getElementById('regular-input-web-hide'), 'Keyboard_laokeys', 'lo');
          setHideVirtualKeyboardOnFocus('numeric-input-web');
          setHideVirtualKeyboardOnFocus('none-input-web');
          setHideVirtualKeyboardOnFocus('email-input-web');
          setHideVirtualKeyboardOnFocus('regular-input-web-hide');
        });
      })(keyman);
    </script>
  </head>
  <body>
    <div>Numeric input</div>
    <input id="numeric-input" placeholder="Enter a number" inputmode="numeric"/>
    <br><br>

    <div>None input</div>
    <input id="none-input" placeholder="Enter something" inputmode="none"/>
    <br><br>

    <div>Email input</div>
    <input id="email-input" placeholder="Enter an email address" inputmode="email"/>
    <br><br>

    <div>Numeric input</div>
    <input id="numeric-input-web" placeholder="Enter a number" inputmode="numeric"/>
    <br><br>

    <div>None input</div>
    <input id="none-input-web" placeholder="Enter something" inputmode="none"/>
    <br><br>

    <div>Email input</div>
    <input id="email-input-web" placeholder="Enter an email address" inputmode="email"  class="kmw-disabled"/>
    <br><br>

    <div>Regular input</div>
    <input id="regular-input-web" placeholder="Enter something"/>
    <br><br>
    <div>Regular input</div>
    <input id="regular-input-web-hide" placeholder="Enter something"/>
    <br><br>
    <form name='f' action='.' method='post'>

    <p>Email to <span class='note'>(KeymanWeb not enabled)</span><br /><input type='text' name='address' size="40" placeholder="id = address"/></p>

    <p>Subject <span class='note'>(Defaults to 'English' or 'off' unless on a touch-based device)</span><br /><input type='text' name='subject' size="40" placeholder="id = subject"/></p>

    <p>Message body <span class='note'>(Defaults to 'LaoKeys')</span><br /><textarea name='text' cols='40' rows='10' placeholder="id = text"></textarea></p>

    </form>
</body>
</html>
